# Neon = Postgres (set DATABASE_URL from Neon dashboard).
# Render = hosts the API + frontend (no Render Postgres).
#
# Setup order after Blueprint creates the services:
# 1. Neon → copy connection string → spicebush-api DATABASE_URL
# 2. Deploy API, note its URL (https://spicebush-api.onrender.com)
# 3. spicebush-web: VITE_API_URL=<api url>, VITE_MAPBOX_TOKEN=<pk...> → redeploy
# 4. spicebush-api: CORS_ORIGINS=<static site url> → redeploy API

services:
  - type: web
    name: spicebush-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: spicebush-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
